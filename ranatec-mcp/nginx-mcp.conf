# Proxy https://ranatec.com/mcp → ranatec-mcp (Node, port 3000).
# Place inside the ranatec.com `server { … }` block, BEFORE the WordPress `location /` block.
location = /mcp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # Streamable HTTP may answer with an SSE stream
    proxy_read_timeout 60s;
}
location ^~ /mcp/ {                 # /mcp/health, /mcp/tools
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
